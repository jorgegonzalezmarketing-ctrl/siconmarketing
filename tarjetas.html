<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tarjetas para imprimir — Sí Con Marketing</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400;62..125,500;62..125,600;62..125,700;62..125,800&display=swap" rel="stylesheet" />

<style>
/* ───────────────────────────────────────────────
   Hoja A4 con 10 tarjetas de 85 × 55 mm (tamaño
   tarjeta de visita). Una sola cara: se imprime
   en cualquier parte y se corta por las líneas.
   Ctrl + P → Tamaño A4 · Márgenes: ninguno ·
   marcar "Gráficos de fondo".
   ─────────────────────────────────────────────── */
:root{
  --crema:#F7EFE3;
  --manjar:#EADCC0;
  --arena:#DCC9A6;
  --terracota:#B5643C;
  --terracota-f:#8E4526;
  --cafe:#2E2620;
  --cafe-2:#5C4E40;
  --cafe-3:#6B5B4B;
  --f:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#8a8378;font-family:var(--f);color:var(--cafe);-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}

/* barra de ayuda — no se imprime */
.ayuda{
  position:sticky;top:0;z-index:10;
  background:var(--cafe);color:var(--crema);
  padding:14px 20px;font-size:14px;line-height:1.5;
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;text-align:center;
}
.ayuda b{color:#E8C9AF}
.ayuda button{
  font-family:var(--f);font-weight:700;font-size:14px;
  background:var(--terracota);color:#fff;border:0;border-radius:10px;
  padding:9px 18px;cursor:pointer;
}
.ayuda button:hover{background:var(--terracota-f)}

.hoja{
  width:210mm;height:297mm;
  margin:22px auto;
  background:#fff;
  padding:13.5mm 20mm;
  display:grid;
  grid-template-columns:repeat(2,85mm);
  grid-template-rows:repeat(5,55mm);
  gap:0;
  justify-content:center;align-content:center;
}

.tarjeta{
  width:85mm;height:55mm;
  background:var(--crema);
  border:.3mm dashed var(--arena);      /* guía de corte */
  padding:5mm;
  display:flex;align-items:center;gap:4mm;
  overflow:hidden;
  position:relative;
}

.txt{flex:1;min-width:0}
.marca{display:flex;align-items:center;gap:2mm;margin-bottom:3.4mm}
.marca svg{width:7.5mm;height:7.5mm;display:block}
.marca span{font-weight:700;font-size:2.5mm;letter-spacing:.1em;text-transform:uppercase;color:var(--cafe-3)}

.nombre{font-weight:800;font-size:4.9mm;letter-spacing:-.025em;line-height:1.05;white-space:nowrap}
.rol{font-weight:600;font-size:2.9mm;color:var(--terracota-f);margin-top:.8mm}
.claim{font-size:2.9mm;color:var(--cafe-2);line-height:1.35;margin-top:2.6mm}

.datos{margin-top:3.6mm;display:flex;flex-direction:column;gap:1.1mm;font-size:2.75mm;color:var(--cafe-2)}
.datos div{display:flex;align-items:center;gap:1.6mm}
.datos svg{width:3.2mm;height:3.2mm;flex:none;color:var(--terracota-f)}
.datos b{font-weight:700;color:var(--cafe)}

.qr{width:26mm;flex:none;text-align:center}
/* el SVG viene en café sobre crema: se funde con la tarjeta en vez
   de quedar como un parche blanco, y el contraste sigue siendo altísimo */
.qr img{width:26mm;height:26mm}
.qr small{
  display:block;margin-top:1.6mm;font-size:2.3mm;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;color:var(--cafe-3);line-height:1.3;
}

@media print{
  .ayuda{display:none}
  body{background:#fff}
  .hoja{margin:0;box-shadow:none;page-break-after:always}
  .tarjeta{border-color:#e3d6bd}
  @page{size:A4;margin:0}
}
@media screen{
  .hoja{box-shadow:0 10px 40px rgba(0,0,0,.35)}
}
</style>
</head>
<body>

<div class="ayuda">
  <span>10 tarjetas por hoja · <b>Ctrl&nbsp;+&nbsp;P</b> → A4 · Márgenes: <b>Ninguno</b> · marca <b>«Gráficos de fondo»</b> · corta por las líneas.</span>
  <button onclick="window.print()">Imprimir</button>
</div>

<div class="hoja" id="hoja"></div>

<template id="modelo">
  <div class="tarjeta">
    <div class="txt">
      <div class="marca">
        <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sí Con Marketing">
          <circle cx="100" cy="100" r="100" fill="#2E2620"/>
          <text x="112.05" y="158" text-anchor="end" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="113.39" fill="#F7EFE3">S</text>
          <rect x="115.89" y="81.18" width="23.74" height="76.82" fill="#F7EFE3"/>
          <polygon points="115.89,75.49 139.63,75.49 149.77,57.44 126.03,57.44" fill="#F7EFE3"/>
          <rect x="104.75" y="42" width="26.89" height="10.75" rx="5.38" fill="#B5643C" transform="rotate(-30 118.2 47.38)"/>
        </svg>
        <span>Sí Con Marketing</span>
      </div>

      <div class="nombre">Jorge González</div>
      <div class="rol">Marketing digital · San Felipe</div>
      <div class="claim">Webs, contenido y redes para negocios del Valle de Aconcagua.</div>

      <div class="datos">
        <div>
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91S17.5 2 12.04 2z"/></svg>
          <b>+56 9 4432 1958</b>
        </div>
        <div>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>
          siconmarketing.vercel.app
        </div>
      </div>
    </div>

    <div class="qr">
      <img src="qr-hola.svg" alt="Código QR con el contacto de Jorge González" />
      <small>Escanéame</small>
    </div>
  </div>
</template>

<script>
/* 10 copias de la misma tarjeta. */
(function () {
  var hoja = document.getElementById('hoja');
  var modelo = document.getElementById('modelo');
  for (var i = 0; i < 10; i++) hoja.appendChild(modelo.content.cloneNode(true));
})();
</script>

</body>
</html>
