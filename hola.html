<style>
/* ───────────────────────────────────────────────
   Sí Con Marketing — tarjeta de presentación
   La página a la que llega quien escanea el QR.
   Marca v5 TERRACOTA · tokens espejo de marca/brand.css
   ─────────────────────────────────────────────── */
:root{
  --manjar:#EADCC0;
  --crema:#F7EFE3;
  --arena:#DCC9A6;
  --terracota:#B5643C;
  --terracota-f:#8E4526;
  --durazno:#D69A76;
  --cafe:#2E2620;
  --cafe-2:#5C4E40;
  --cafe-3:#6B5B4B;
  --verde-wa:#1F8F4E;
  --f:"Archivo",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:var(--manjar);
  color:var(--cafe);
  font-family:var(--f);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  min-height:100svh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px 20px calc(24px + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}

/* manchas de fondo, igual que el hero del sitio */
.blob{position:fixed;border-radius:50%;filter:blur(80px);opacity:.24;z-index:0;pointer-events:none}
.b1{width:420px;height:420px;background:var(--crema);top:-150px;right:-120px}
.b2{width:380px;height:380px;background:var(--durazno);bottom:-170px;left:-130px}

.tarjeta{
  position:relative;z-index:2;
  width:100%;max-width:430px;
  background:var(--crema);
  border:1px solid var(--arena);
  border-radius:28px;
  padding:34px 26px 26px;
  text-align:center;
  box-shadow:0 24px 60px -28px rgba(46,38,32,.35);
  animation:entra .55s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.marca{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:22px}
.marca svg{width:32px;height:32px;display:block}
.marca span{font-weight:700;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--cafe-3)}

.foto{
  width:112px;height:112px;margin:0 auto 18px;
  border-radius:50%;overflow:hidden;
  border:3px solid var(--manjar);
  box-shadow:0 8px 22px -10px rgba(46,38,32,.5);
}
.foto img{width:100%;height:100%;object-fit:cover;object-position:center top}

h1{font-weight:800;font-size:34px;letter-spacing:-.03em;line-height:1.05;margin-bottom:8px}
.rol{font-weight:600;font-size:15px;color:var(--terracota-f);margin-bottom:14px}
.lead{font-size:15.5px;color:var(--cafe-2);text-wrap:pretty;max-width:330px;margin:0 auto 26px}
.lead b{color:var(--cafe);font-weight:700}

/* ── botones ─────────────────────────────────── */
.acciones{display:flex;flex-direction:column;gap:11px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:10px;
  min-height:56px;padding:14px 20px;border-radius:16px;
  font-weight:700;font-size:16.5px;letter-spacing:-.01em;
  border:1.5px solid transparent;
  transition:transform .18s ease,background .22s ease,box-shadow .22s ease;
  -webkit-tap-highlight-color:transparent;
}
.btn:active{transform:scale(.975)}
.btn svg{width:21px;height:21px;flex:none}

.btn-wa{background:var(--verde-wa);color:#fff;box-shadow:0 10px 24px -12px rgba(31,143,78,.9)}
.btn-wa:hover{background:#18773f}
.btn-web{background:var(--cafe);color:var(--crema)}
.btn-web:hover{background:var(--terracota-f)}
.btn-vcf{background:transparent;color:var(--cafe);border-color:var(--arena);font-size:15.5px;min-height:50px}
.btn-vcf:hover{background:var(--manjar);border-color:var(--cafe-3)}

.pie{
  margin-top:24px;padding-top:18px;border-top:1px solid var(--arena);
  display:flex;flex-direction:column;gap:7px;
  font-size:13.5px;color:var(--cafe-3);
}
.pie .lugar{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:600}
.pie .dot{width:12px;height:3.5px;border-radius:999px;background:var(--terracota);transform:rotate(-27deg)}
.pie a{border-bottom:1px solid var(--arena);padding-bottom:1px}
.pie a:hover{color:var(--cafe);border-color:var(--cafe-3)}

@media (max-width:360px){
  h1{font-size:30px}
  .tarjeta{padding:28px 20px 22px}
  .foto{width:96px;height:96px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<div class="blob b1"></div>
<div class="blob b2"></div>

<main class="tarjeta">

  <div class="marca">
    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sí Con Marketing">
      <circle cx="100" cy="100" r="100" fill="#2E2620"/>
      <text x="112.05" y="158" text-anchor="end" font-family="Archivo, system-ui, sans-serif" font-weight="800" font-size="113.39" fill="#F7EFE3">S</text>
      <rect x="115.89" y="81.18" width="23.74" height="76.82" fill="#F7EFE3"/>
      <polygon points="115.89,75.49 139.63,75.49 149.77,57.44 126.03,57.44" fill="#F7EFE3"/>
      <rect x="104.75" y="42" width="26.89" height="10.75" rx="5.38" fill="#B5643C" transform="rotate(-30 118.2 47.38)"/>
    </svg>
    <span>Sí Con Marketing</span>

  <div class="foto">

  <h1>Jorge González</h1>

  <p class="lead" id="lead">
    Hago que los negocios de la zona <b>se vean bien en internet</b>: páginas web, contenido y redes.

  <div class="acciones">

      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.65-2.05-.17-.3-.02-.46.13-.6.14-.14.3-.36.45-.53.15-.18.2-.3.3-.5.1-.2.05-.38-.03-.53-.07-.15-.67-1.6-.92-2.2-.24-.58-.48-.5-.67-.5h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.2 5.08 4.49.71.3 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35z"/><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.87 9.87 0 0 0 4.79 1.22h.01c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 18.13h-.01a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.2 8.2 0 0 1-1.26-4.36c0-4.54 3.7-8.24 8.25-8.24a8.2 8.2 0 0 1 5.83 2.42 8.19 8.19 0 0 1 2.41 5.83c0 4.54-3.7 8.24-8.24 8.24z"/></svg>
      Escríbeme por WhatsApp
    </a>

    <a class="btn btn-web" href="/" >
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18 15 15 0 0 1 0-18z"/></svg>
      Ver mi trabajo
    </a>

    <a class="btn btn-vcf" href="jorge-gonzalez.vcf" download="Jorge Gonzalez - Si Con Marketing.vcf">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg>
      Guardar mi contacto
    </a>
  </div>

  <div class="pie">
    <span class="lugar"><span class="dot"></span> San Felipe, Valle de Aconcagua</span>
    <span><a href="mailto:jorgegonzalez.marketing@gmail.com">jorgegonzalez.marketing@gmail.com</a></span>
  </div>

</main>

<script>
/* El mensaje de WhatsApp llega escrito. Cambia según de dónde venga la persona:
   /hola            → mensaje neutro
   /hola?e=taller   → el del taller de IA en la municipalidad
   Así el lead entra a la bandeja con nombre y rubro, no como un "hola" suelto. */
(function () {
  var TEL = '56944321958';

  var eventos = {
    taller: {
      lead: 'Nos vimos en el taller de la municipalidad. Hago que los negocios de la zona <b>se vean bien en internet</b>: páginas web, contenido y redes.',
      msg: '¡Hola Jorge! Soy [tu nombre], nos vimos en el taller.'
    }
  };

  var e = new URLSearchParams(location.search).get('e');
  var cfg = (e && eventos[e]) || null;

  var msg = cfg ? cfg.msg
                : '¡Hola Jorge! Soy [tu nombre], vi tu tarjeta.';

  if (cfg) document.getElementById('lead').innerHTML = cfg.lead;
  document.getElementById('wa').href =
    'https://wa.me/' + TEL + '?text=' + encodeURIComponent(msg);
})();
</script>

</body>
